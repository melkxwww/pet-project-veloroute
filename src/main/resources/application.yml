server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/veloroute_db
    username: postgres
    password: root

  application:
    name: veloroute

  jackson:
    default-property-inclusion: non_null

  jpa:
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: localhost
      port: 6379

veloroute:
  graphhopper:
    osm-file-path: ./graphhopper/crimea_baked.osm.pbf
    graph-cache-dir: ./graphhopper/graph-cache